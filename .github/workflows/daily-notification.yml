name: Daily System Design Notification

on:
  schedule:
    # 05:00 UTC = 13:00 (1pm) Asia/Singapore, no DST to account for.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        run: uv sync --locked

      - name: Send notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run system-design-app

      - name: Persist content bank and send history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/content_bank.json data/state.json
          git diff --cached --quiet || git commit -m "Update content bank / send state [skip ci]"
          git push
